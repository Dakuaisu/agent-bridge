name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -rs

  bare-linux:
    name: pytest (Linux, en_US.UTF-8 not generated, no tzdata)
    runs-on: ubuntu-latest
    container: python:3.12-slim
    env:
      LANG: en_US.UTF-8
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git, remove tzdata
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          apt-get purge -y tzdata
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[dev]'
      - name: Check that the locale and the tz database are missing
        run: |
          git --version
          python - <<'EOF'
          import locale
          import zoneinfo

          try:
              locale.setlocale(locale.LC_ALL, "")
          except locale.Error:
              print("en_US.UTF-8 is not installed")
          else:
              raise SystemExit("en_US.UTF-8 is installed, so this job would not test the locale fallback")
          try:
              zoneinfo.ZoneInfo("UTC")
          except zoneinfo.ZoneInfoNotFoundError:
              print("no tz database")
          else:
              raise SystemExit("a tz database is present, so this job would not test its absence")
          EOF
      - run: python -m pytest -rs
